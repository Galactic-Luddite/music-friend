name: Feature request
description: Propose a focused product or provider capability.
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and provider impact
      description: Note any new data source, credential, permission, network access, storage, export, or notification behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
