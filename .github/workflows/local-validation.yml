name: Local validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]" pip-audit pip-licenses
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m mypy --strict src/music_friend
      - run: python -m pip_audit
      - run: python -m piplicenses --fail-on GPL

  source-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: python scripts/scan_public_tree.py .

  build-and-install:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build
      - run: python -m build --outdir dist
      - run: python scripts/scan_public_tree.py dist
      - run: >
          python -c "from pathlib import Path; import shutil;
          source = Path('dist'); destination = Path('wheel-dist');
          wheels = sorted(source.glob('*.whl'));
          assert len(wheels) == 1, 'build must produce exactly one wheel';
          destination.mkdir(); shutil.copy2(wheels[0], destination / wheels[0].name)"
      - run: >
          python -m pip download --only-binary=:all: --dest wheelhouse-${{ matrix.python }} hatchling ".[dev]"
      - run: python scripts/clean-install.py --distribution wheel-dist --wheelhouse wheelhouse-${{ matrix.python }}

  clean-room:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: >
          python -m pip download --only-binary=:all: --dest wheelhouse hatchling ".[dev]"
      - run: |
          commit=$(git rev-parse HEAD)
          /bin/bash scripts/clean-room-phase1.sh \
            --python "$(python -c 'import sys; print(sys.executable)')" \
            --wheelhouse "$PWD/wheelhouse" \
            --result "$RUNNER_TEMP/music-friend-clean-room.json" \
            --commit "$commit"
