name: Local validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q --ignore=tests/clean_room

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]" pip-audit pip-licenses
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m mypy --strict src/music_friend
      - run: python -m pip_audit
      - run: python -m piplicenses --fail-on GPL

  source-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks CLI
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  $archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Verify scanner and scan Git history
        run: |
          canary="$RUNNER_TEMP/gitleaks-canary.txt"
          printf '%s%s\n' 'ghp_' 'aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789' > "$canary"
          set +e
          gitleaks detect --no-git --redact --no-banner --source "$canary"
          canary_status=$?
          set -e
          test "$canary_status" -eq 1
          gitleaks detect --redact --no-banner --source .
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: python scripts/scan_public_tree.py .

  build-and-install:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build
      - run: python -m build --outdir dist
      - run: python scripts/scan_public_tree.py dist
      - run: >
          python -c "from pathlib import Path; import shutil;
          source = Path('dist'); destination = Path('wheel-dist');
          wheels = sorted(source.glob('*.whl'));
          assert len(wheels) == 1, 'build must produce exactly one wheel';
          destination.mkdir(); shutil.copy2(wheels[0], destination / wheels[0].name)"
      - run: >
          python -m pip download --only-binary=:all: --dest wheelhouse-${{ matrix.python }} hatchling ".[dev]"
      - run: python scripts/clean-install.py --distribution wheel-dist --wheelhouse wheelhouse-${{ matrix.python }}

  clean-room:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: >
          python -m pip download --only-binary=:all: --dest "$RUNNER_TEMP/wheelhouse" hatchling ".[dev]"
      - run: |
          commit=$(git rev-parse HEAD)
          /bin/bash scripts/clean-room-phase1.sh \
            --python "$(python -c 'import sys; from pathlib import Path; print(Path(sys.executable).resolve())')" \
            --wheelhouse "$RUNNER_TEMP/wheelhouse" \
            --result "$RUNNER_TEMP/music-friend-clean-room.json" \
            --commit "$commit"
      - name: Report bounded clean-room failure
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/music-friend-clean-room.json" ]]; then
            cat "$RUNNER_TEMP/music-friend-clean-room.json"
          else
            printf '%s\n' 'clean-room result was not created'
          fi
